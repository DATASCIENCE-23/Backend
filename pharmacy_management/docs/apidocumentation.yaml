components:
  parameters:
    IdParameter:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PageParameter:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    LimitParameter:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
  schemas:
    CommonResponse:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuditRequest:
      type: object
      required:
      - action
      - entity
      - entity_id
      - performed_by
      properties:
        action:
          type: string
        entity:
          type: string
        entity_id:
          type: integer
        performed_by:
          type: integer
        description:
          type: string
        ip_address:
          type: string
    AuditResponse:
      allOf:
      - $ref: '#/components/schemas/CommonResponse'
      - type: object
        properties:
          action:
            type: string
          entity:
            type: string
          entity_id:
            type: integer
          performed_by:
            type: integer
          description:
            type: string
          ip_address:
            type: string
    AuditListResponse:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditResponse'
    DispenseRequest:
      type: object
      required:
      - prescription_id
      - dispensed_by
      properties:
        prescription_id:
          type: integer
        dispensed_by:
          type: integer
        dispense_date:
          type: string
          format: date-time
        remarks:
          type: string
        is_active:
          type: boolean
    DispenseUpdateRequest:
      type: object
      properties:
        dispense_date:
          type: string
          format: date-time
        remarks:
          type: string
        is_active:
          type: boolean
    DispenseResponse:
      allOf:
      - $ref: '#/components/schemas/CommonResponse'
      - type: object
        properties:
          prescription_id:
            type: integer
          dispensed_by:
            type: integer
          dispense_date:
            type: string
            format: date-time
          remarks:
            type: string
          is_active:
            type: boolean
    DispenseListResponse:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/DispenseResponse'
    DoctorRequest:
      type: object
      required:
      - name
      - mobile
      - specialization_id
      properties:
        name:
          type: string
        mobile:
          type: string
        email:
          type: string
          format: email
        gender:
          type: string
        experience:
          type: integer
        qualification:
          type: string
        specialization_id:
          type: integer
        is_active:
          type: boolean
    DoctorUpdateRequest:
      type: object
      properties:
        name:
          type: string
        mobile:
          type: string
        email:
          type: string
          format: email
        gender:
          type: string
        experience:
          type: integer
        qualification:
          type: string
        specialization_id:
          type: integer
        is_active:
          type: boolean
    DoctorResponse:
